name: Auto Merge

on:
  push:
    branches:
      - 'claude/**'
      - 'feature/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  direct-merge:
    name: Direct Merge to Main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get default branch
        id: default-branch
        run: |
          DEFAULT_BRANCH=$(gh repo view --json defaultBranchRef -q '.defaultBranchRef.name')
          echo "branch=$DEFAULT_BRANCH" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge to default branch
        run: |
          git fetch origin ${{ steps.default-branch.outputs.branch }}
          git checkout ${{ steps.default-branch.outputs.branch }}
          git merge origin/${{ github.ref_name }} --no-ff -m "Merge ${{ github.ref_name }} into ${{ steps.default-branch.outputs.branch }}"
          git push origin ${{ steps.default-branch.outputs.branch }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
